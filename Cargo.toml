[package]
name = "stillwatch"
version = "0.6.1"
edition = "2021"
# Verified in CI, not guessed. The crate itself builds on less, but `url` pulls
# in the icu crates and those need 1.88.
rust-version = "1.88"
license = "MIT"
description = "A watchdog for processes that run unattended."
repository = "https://github.com/PyraVim/stillwatch"
readme = "README.md"

# Versions are pinned exactly. A watchdog that silently changes behaviour on
# `cargo update` is not a watchdog.
[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.9"
chrono = "=0.4.45"
clap = { version = "=4.6.6", features = ["derive"] }
humantime = "=2.4.0"
humantime-serde = "=1.1.1"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# Named directly so a bad check url is a real typed error, not a string.
url = "=2.5.8"

# Passive mode needs one platform call apiece: "is this pid running" has no
# portable answer in std.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
